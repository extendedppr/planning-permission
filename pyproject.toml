[tool.poetry]
name = "planning permission"
version = "0.0.1"
description = ""
authors = ["ExtendedPPR <extendedppr@gmail.com>"]
readme = "README.md"
packages = [{include="planning_permission", from="src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
requests = "<3"
progressbar2 = "4.5.0"
ujson = "5.10.0"
tabulate = "0.9.0"
openpyxl = "3.1.5"
peewee = "4.0.4"
backoff = "*"

[tool.poetry.group.test.dependencies]
pytest = "9.0.3"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
download_planning_permission = "scripts.download_planning_permission:main"
search = "scripts.search:main"
